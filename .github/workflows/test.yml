name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Craftwork2720/meguru
          ref: 7a6e9b8033c228c187855af8fcd4c4580018ac4b
          path: .test-meguru
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y luajit lua-socket lua-dkjson
      - run: luajit tests/dupskip.lua.test .test-meguru
